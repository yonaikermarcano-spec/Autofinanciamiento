<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoLending OS - Sistema Fintech & Financiadora Portátil</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            zinc: {
              850: '#1e1e24',
              950: '#0c0c0e'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(150, 150, 150, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(150, 150, 150, 0.5);
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Componentes e Íconos Simples
    const Icon = ({ name, className = "w-4 h-4" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });
      return <i data-lucide={name} className={className}></i>;
    };

    // Datos Iniciales Portátiles
    const INITIAL_CONTRACTS = [
      {
        id: "ctr-001",
        clientName: "José Gregorio Hernández",
        clientDocId: "V-18.942.301",
        phone: "+58 414-332-9011",
        vehicle: "Bera SBR 150cc (2026)",
        plate: "AE8K92M",
        priceUSD: 1450,
        paidUSD: 720,
        pendingUSD: 730,
        weeklyQuotaUSD: 20.25,
        status: "AL_DIA",
        deliveryStatus: "ENTREGADO",
        overdueDays: 0,
        city: "Caracas"
      },
      {
        id: "ctr-002",
        clientName: "Andrés Eloy Blanco",
        clientDocId: "V-22.109.840",
        phone: "+58 412-998-1244",
        vehicle: "Toro León 150cc (2026)",
        plate: "AF9J11L",
        priceUSD: 1600,
        paidUSD: 480,
        pendingUSD: 1120,
        weeklyQuotaUSD: 23.30,
        status: "MOROSO",
        deliveryStatus: "ENTREGADO",
        overdueDays: 5,
        city: "Valencia"
      },
      {
        id: "ctr-003",
        clientName: "Mariana Coromoto Silva",
        clientDocId: "V-25.882.104",
        phone: "+58 416-554-3211",
        vehicle: "Empire Keeway Express II 150cc",
        plate: "EN TRÁMITE",
        priceUSD: 1350,
        paidUSD: 405,
        pendingUSD: 945,
        weeklyQuotaUSD: 19.50,
        status: "AL_DIA",
        deliveryStatus: "ACUMULANDO_CUOTAS",
        overdueDays: 0,
        city: "Maracay"
      },
      {
        id: "ctr-004",
        clientName: "Carlos Eduardo Mendoza",
        clientDocId: "V-19.482.019",
        phone: "+58 414-229-1048",
        vehicle: "Bera Kavak 150cc",
        plate: "AB1C23D",
        priceUSD: 1550,
        paidUSD: 1550,
        pendingUSD: 0,
        weeklyQuotaUSD: 0,
        status: "PAGADO_TOTAL",
        deliveryStatus: "ENTREGADO",
        overdueDays: 0,
        city: "Caracas"
      }
    ];

    const INITIAL_ROLES_PERMISSIONS = {
      GERENTE_GENERAL: ["VIEW_DASHBOARD", "MANAGE_USERS", "PROCESS_PAYMENTS", "TREASURY_VAULT", "KILL_SWITCH", "LEGAL_DOCS"],
      CAJERO: ["VIEW_DASHBOARD", "PROCESS_PAYMENTS", "TREASURY_VAULT", "PRINT_RECEIPTS"],
      ASESOR_VENTAS: ["VIEW_DASHBOARD", "REGISTER_CLIENT", "SIMULATOR"],
      COBRADOR_CAMPO: ["VIEW_DASHBOARD", "FIELD_RECOVERY", "RECORD_PAYMENT"]
    };

    function App() {
      // Estado de Tema Claro / Oscuro
      const [theme, setTheme] = useState(() => localStorage.getItem("autolending_theme") || "light");
      const [currentSection, setCurrentSection] = useState("dashboard");
      const [userRole, setUserRole] = useState("GERENTE_GENERAL");
      
      // Tasas
      const [usdRate, setUsdRate] = useState(46.85);
      const [eurRate, setEurRate] = useState(50.12);
      const [usdtRate, setUsdtRate] = useState(48.20);
      const [activeRateType, setActiveRateType] = useState("USD_BCV");

      // Datos y Contratos
      const [contracts, setContracts] = useState(() => {
        const saved = localStorage.getItem("autolending_contracts_portable");
        return saved ? JSON.parse(saved) : INITIAL_CONTRACTS;
      });

      // Permisos RBAC
      const [rbacMatrix, setRbacMatrix] = useState(() => {
        const saved = localStorage.getItem("autolending_rbac_portable");
        return saved ? JSON.parse(saved) : INITIAL_ROLES_PERMISSIONS;
      });

      // 7 Dimensiones
      const [dimensions, setDimensions] = useState(() => {
        const saved = localStorage.getItem("autolending_dimensions_portable");
        return saved ? JSON.parse(saved) : {
          downPaymentPct: 30,
          interestRateAnnual: 18,
          termWeeks: 48,
          frequency: "WEEKLY",
          lateFeeType: "FIXED_USD",
          lateFeeValue: 1.0,
          lateFeeFrequency: "DAILY",
          graceDays: 2,
          deliveryMode: "IMMEDIATE",
          killSwitchGraceDays: 3,
          requireGuarantor: "SCORING_BASED",
          igtfTax: true,
          acceptCrypto: true
        };
      });

      // Modales
      const [isPaymentModalOpen, setIsPaymentModalOpen] = useState(false);
      const [isCashierShiftOpen, setIsCashierShiftOpen] = useState(false);
      const [selectedContract, setSelectedContract] = useState(contracts[0]);
      const [payAmount, setPayAmount] = useState(25);
      const [payMethod, setPayMethod] = useState("PAGO_MOVIL");
      const [payRef, setPayRef] = useState("PM-992014");

      useEffect(() => {
        localStorage.setItem("autolending_theme", theme);
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
        } else {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
        }
      }, [theme]);

      useEffect(() => {
        localStorage.setItem("autolending_contracts_portable", JSON.stringify(contracts));
      }, [contracts]);

      useEffect(() => {
        localStorage.setItem("autolending_rbac_portable", JSON.stringify(rbacMatrix));
      }, [rbacMatrix]);

      useEffect(() => {
        localStorage.setItem("autolending_dimensions_portable", JSON.stringify(dimensions));
      }, [dimensions]);

      const activeRate = activeRateType === "USD_BCV" ? usdRate : activeRateType === "EUR_BCV" ? eurRate : usdtRate;

      // Métricas Consolidadas
      const totalColocadoUSD = contracts.reduce((acc, c) => acc + c.priceUSD, 0);
      const totalRecaudadoUSD = contracts.reduce((acc, c) => acc + c.paidUSD, 0);
      const totalCarteraPendienteUSD = contracts.reduce((acc, c) => acc + c.pendingUSD, 0);
      const countMorosos = contracts.filter(c => c.status === "MOROSO" || c.overdueDays > 0).length;

      const handleProcessPayment = (e) => {
        e.preventDefault();
        const amt = Number(payAmount);
        const updated = contracts.map(c => {
          if (c.id === selectedContract.id) {
            const newPaid = c.paidUSD + amt;
            const newPending = Math.max(0, c.pendingUSD - amt);
            return {
              ...c,
              paidUSD: newPaid,
              pendingUSD: newPending,
              status: newPending === 0 ? "PAGADO_TOTAL" : "AL_DIA",
              overdueDays: 0
            };
          }
          return c;
        });
        setContracts(updated);
        setIsPaymentModalOpen(false);
        alert(`✅ Pago de $${amt} USD (Bs. ${(amt * activeRate).toFixed(2)}) procesado exitosamente con Ref: ${payRef}`);
      };

      const togglePermission = (role, perm) => {
        const list = new Set(rbacMatrix[role] || []);
        if (list.has(perm)) {
          list.delete(perm);
        } else {
          list.add(perm);
        }
        setRbacMatrix({ ...rbacMatrix, [role]: Array.from(list) });
      };

      return (
        <div className="flex h-screen overflow-hidden text-zinc-900 dark:text-zinc-100">
          
          {/* SIDEBAR */}
          <aside className="w-64 bg-white dark:bg-zinc-950 border-r border-zinc-200 dark:border-zinc-800 p-4 flex flex-col justify-between select-none">
            <div className="space-y-6">
              <div className="flex items-center space-x-3 px-2">
                <div className="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold text-sm shadow-md shadow-emerald-600/30">
                  AL
                </div>
                <div>
                  <h2 className="font-bold text-sm leading-tight text-zinc-900 dark:text-white">AutoLending OS</h2>
                  <span className="text-[10px] text-emerald-600 dark:text-emerald-400 font-mono font-bold">● Versión Portátil Offline</span>
                </div>
              </div>

              <nav className="space-y-1 text-xs font-semibold">
                {[
                  { id: "dashboard", label: "Dashboard Ejecutivo", icon: "layout-dashboard" },
                  { id: "clients", label: "Clientes & Cartera CRM", icon: "users" },
                  { id: "simulator", label: "Simulador de Crédito", icon: "calculator" },
                  { id: "treasury", label: "Caja & Bóveda", icon: "wallet" },
                  { id: "dimensions", label: "7 Dimensiones Financiadora", icon: "sliders" },
                  { id: "rbac", label: "Seguridad & Permisos RBAC", icon: "shield-check" }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setCurrentSection(tab.id)}
                    className={"w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition cursor-pointer " + (
                      currentSection === tab.id
                        ? "bg-zinc-100 text-zinc-900 dark:bg-zinc-850 dark:text-white font-bold"
                        : "text-zinc-600 dark:text-zinc-400 hover:bg-zinc-50 dark:hover:bg-zinc-900 hover:text-zinc-900 dark:hover:text-white"
                    )}
                  >
                    <Icon name={tab.icon} className="w-4 h-4 text-emerald-500" />
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            {/* Configuración de Tema & Perfil */}
            <div className="pt-4 border-t border-zinc-200 dark:border-zinc-800 space-y-3 text-xs">
              <div className="flex items-center justify-between p-2 rounded-xl bg-zinc-50 dark:bg-zinc-900">
                <span className="font-medium text-zinc-700 dark:text-zinc-300">Modo de Vista</span>
                <div className="flex items-center bg-zinc-200 dark:bg-zinc-800 p-0.5 rounded-lg">
                  <button
                    onClick={() => setTheme("light")}
                    className={"p-1 rounded-md transition " + (theme === "light" ? "bg-white text-zinc-900 shadow-xs" : "text-zinc-500 hover:text-zinc-900")}
                    title="Modo Claro"
                  >
                    <Icon name="sun" className="w-3.5 h-3.5" />
                  </button>
                  <button
                    onClick={() => setTheme("dark")}
                    className={"p-1 rounded-md transition " + (theme === "dark" ? "bg-zinc-950 text-white shadow-xs" : "text-zinc-500 hover:text-zinc-100")}
                    title="Modo Oscuro"
                  >
                    <Icon name="moon" className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>

              <div className="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 text-[11px]">
                <strong className="text-emerald-800 dark:text-emerald-300 block">💾 100% Autónomo</strong>
                <span className="text-emerald-700 dark:text-emerald-400">Tus datos se guardan en este navegador sin requerir internet ni servidores.</span>
              </div>
            </div>
          </aside>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 flex flex-col h-screen overflow-hidden bg-zinc-50 dark:bg-zinc-950">
            
            {/* Header */}
            <header className="h-16 border-b border-zinc-200 dark:border-zinc-800 px-6 flex items-center justify-between bg-white dark:bg-zinc-950 flex-shrink-0">
              <div className="flex items-center space-x-3">
                <span className="font-bold text-sm text-zinc-800 dark:text-zinc-200">
                  {currentSection === "dashboard" && "📊 Resumen Ejecutivo de Cartera"}
                  {currentSection === "clients" && "👥 Clientes & Contratos Activos"}
                  {currentSection === "simulator" && "🧮 Simulador Público de Crédito"}
                  {currentSection === "treasury" && "👛 Arqueo de Caja & Recaudación"}
                  {currentSection === "dimensions" && "⚙️ Las 7 Dimensiones de Financiadora"}
                  {currentSection === "rbac" && "🔐 Matriz de Permisos RBAC"}
                </span>
              </div>

              <div className="flex items-center space-x-3">
                {/* Selector de Tasa BCV */}
                <div className="flex items-center space-x-2 bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 px-3 py-1.5 rounded-xl text-xs font-mono font-bold">
                  <span className="text-emerald-500">💵 Tasa Oficial:</span>
                  <span>Bs. {activeRate.toFixed(2)}</span>
                </div>

                {/* Rol Activo */}
                <span className="px-3 py-1.5 rounded-xl bg-purple-500/10 text-purple-600 dark:text-purple-400 border border-purple-500/20 text-xs font-bold font-mono">
                  {userRole}
                </span>
              </div>
            </header>

            {/* Contenedor Scrolleable */}
            <div className="flex-1 p-6 overflow-y-auto max-w-7xl w-full mx-auto space-y-6">
              
              {/* 1. SECCIÓN DASHBOARD */}
              {currentSection === "dashboard" && (
                <div className="space-y-6">
                  {/* Tarjetas KPI */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="p-5 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 space-y-1 shadow-xs">
                      <span className="text-xs font-bold text-zinc-600 dark:text-zinc-400 uppercase">Capital Colocado</span>
                      <h3 className="text-2xl font-extrabold font-mono text-zinc-900 dark:text-white">
                        $${totalColocadoUSD.toLocaleString()} USD
                      </h3>
                      <span className="text-[11px] text-zinc-600 dark:text-zinc-400 font-mono">Bs. {(totalColocadoUSD * activeRate).toLocaleString()} BCV</span>
                    </div>

                    <div className="p-5 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 space-y-1 shadow-xs">
                      <span className="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase">Total Recaudado</span>
                      <h3 className="text-2xl font-extrabold font-mono text-emerald-600 dark:text-emerald-400">
                        $${totalRecaudadoUSD.toLocaleString()} USD
                      </h3>
                      <span className="text-[11px] text-zinc-600 dark:text-zinc-400 font-mono">{( (totalRecaudadoUSD / totalColocadoUSD) * 100 ).toFixed(1)}% de recuperación</span>
                    </div>

                    <div className="p-5 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 space-y-1 shadow-xs">
                      <span className="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase">Cartera por Cobrar</span>
                      <h3 className="text-2xl font-extrabold font-mono text-blue-600 dark:text-blue-400">
                        $${totalCarteraPendienteUSD.toLocaleString()} USD
                      </h3>
                      <span className="text-[11px] text-zinc-600 dark:text-zinc-400 font-mono">{contracts.length} contratos activos</span>
                    </div>

                    <div className="p-5 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 space-y-1 shadow-xs">
                      <span className="text-xs font-bold text-rose-600 dark:text-rose-400 uppercase">Contratos Morosos</span>
                      <h3 className="text-2xl font-extrabold font-mono text-rose-600 dark:text-rose-400">
                        {countMorosos}
                      </h3>
                      <span className="text-[11px] text-zinc-600 dark:text-zinc-400 font-mono">Requieren gestión satelital/calle</span>
                    </div>
                  </div>

                  {/* Tabla Rápida de Cobranzas */}
                  <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-5 space-y-4 shadow-xs">
                    <div className="flex items-center justify-between">
                      <h3 className="font-bold text-sm text-zinc-900 dark:text-white">Plan de Abonos Inmediato</h3>
                      <button 
                        onClick={() => setIsPaymentModalOpen(true)}
                        className="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-1.5 rounded-xl font-bold text-xs transition flex items-center space-x-1.5 shadow-sm cursor-pointer"
                      >
                        <Icon name="plus" className="w-3.5 h-3.5" />
                        <span>Registrar Cobro</span>
                      </button>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead>
                          <tr className="border-b border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-400 font-bold uppercase text-[10px]">
                            <th className="p-3">Cliente / Cédula</th>
                            <th className="p-3">Vehículo</th>
                            <th className="p-3">Cuota Semanal</th>
                            <th className="p-3">Saldo Deudor</th>
                            <th className="p-3">Estatus</th>
                            <th className="p-3 text-right">Acción</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-zinc-200 dark:divide-zinc-800">
                          {contracts.map(c => (
                            <tr key={c.id} className="hover:bg-zinc-50 dark:hover:bg-zinc-800/40 transition">
                              <td className="p-3 font-semibold">
                                <span className="block text-zinc-900 dark:text-white">{c.clientName}</span>
                                <span className="text-[10px] text-zinc-600 dark:text-zinc-400 font-mono">{c.clientDocId} • {c.phone}</span>
                              </td>
                              <td className="p-3 font-mono text-zinc-700 dark:text-zinc-300">{c.vehicle}</td>
                              <td className="p-3 font-bold font-mono text-emerald-600 dark:text-emerald-400">
                                $${c.weeklyQuotaUSD.toFixed(2)} USD
                                <span className="block text-[10px] text-zinc-600 dark:text-zinc-400 font-normal">Bs. {(c.weeklyQuotaUSD * activeRate).toFixed(2)}</span>
                              </td>
                              <td className="p-3 font-mono font-bold text-zinc-900 dark:text-zinc-100">
                                $${c.pendingUSD} USD
                              </td>
                              <td className="p-3">
                                <span className={"px-2.5 py-0.5 rounded-full text-[10px] font-bold font-mono " + (
                                  c.status === "PAGADO_TOTAL" 
                                    ? "bg-emerald-500/10 text-emerald-600 dark:text-emerald-400"
                                    : c.status === "MOROSO"
                                    ? "bg-rose-500/10 text-rose-600 dark:text-rose-400"
                                    : "bg-blue-500/10 text-blue-600 dark:text-blue-400"
                                )}>
                                  {c.status}
                                </span>
                              </td>
                              <td className="p-3 text-right">
                                <button
                                  onClick={() => { setSelectedContract(c); setIsPaymentModalOpen(true); }}
                                  className="bg-zinc-100 hover:bg-zinc-200 dark:bg-zinc-800 dark:hover:bg-zinc-700 text-zinc-800 dark:text-zinc-200 font-bold px-2.5 py-1 rounded-lg text-xs transition cursor-pointer"
                                >
                                  Cobrar
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* 2. SECCIÓN CLIENTES & CRM */}
              {currentSection === "clients" && (
                <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-6 space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="font-bold text-base text-zinc-900 dark:text-white">Cartera Integral de Clientes & Avales</h3>
                      <p className="text-xs text-zinc-600 dark:text-zinc-400">Expedientes de crédito y control de moras en tiempo real.</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {contracts.map(c => (
                      <div key={c.id} className="p-4 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 space-y-3">
                        <div className="flex justify-between items-start">
                          <div>
                            <strong className="text-sm text-zinc-900 dark:text-white block">{c.clientName}</strong>
                            <span className="text-xs text-zinc-600 dark:text-zinc-400 font-mono">{c.clientDocId} • {c.city}</span>
                          </div>
                          <span className="text-xs font-mono font-bold text-emerald-600 dark:text-emerald-400">
                            $${c.paidUSD} / $${c.priceUSD} USD
                          </span>
                        </div>

                        <div className="w-full bg-zinc-200 dark:bg-zinc-800 h-2 rounded-full overflow-hidden">
                          <div 
                            className="bg-emerald-500 h-full rounded-full transition-all duration-300"
                            style={{ width: `${(c.paidUSD / c.priceUSD) * 100}%` }}
                          ></div>
                        </div>

                        <div className="flex items-center justify-between text-xs pt-1">
                          <span className="text-zinc-600 dark:text-zinc-400">🛵 {c.vehicle}</span>
                          <a 
                            href={`https://wa.me/${c.phone.replace(/[^0-9]/g, '')}?text=Hola%20${encodeURIComponent(c.clientName)},%20le%20escribimos%20de%20AutoLending%20para%20recordarle%20su%20cuota%20de%20$${c.weeklyQuotaUSD}%20USD`}
                            target="_blank"
                            className="text-emerald-600 dark:text-emerald-400 font-bold hover:underline flex items-center space-x-1"
                          >
                            <span>WhatsApp</span>
                            <Icon name="message-square" className="w-3 h-3" />
                          </a>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* 3. SIMULADOR DE CRÉDITO */}
              {currentSection === "simulator" && (
                <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-6 max-w-2xl mx-auto space-y-5">
                  <div>
                    <h3 className="font-bold text-base text-zinc-900 dark:text-white">Simulador Financiero de Crédito</h3>
                    <p className="text-xs text-zinc-600 dark:text-zinc-400">Calcula iniciales, cuotas y cronogramas de amortización con tasa oficial.</p>
                  </div>

                  <div className="space-y-4 text-xs">
                    <div>
                      <label className="font-semibold text-zinc-700 dark:text-zinc-300 block mb-1">Precio de la Moto ($ USD)</label>
                      <input 
                        type="number" 
                        defaultValue={1450} 
                        id="sim-price"
                        className="w-full p-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-950 font-mono font-bold text-sm" 
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="font-semibold text-zinc-700 dark:text-zinc-300 block mb-1">Inicial (%)</label>
                        <input 
                          type="number" 
                          defaultValue={30} 
                          id="sim-down"
                          className="w-full p-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-950 font-mono font-bold" 
                        />
                      </div>
                      <div>
                        <label className="font-semibold text-zinc-700 dark:text-zinc-300 block mb-1">Plazo (Semanas)</label>
                        <input 
                          type="number" 
                          defaultValue={48} 
                          id="sim-weeks"
                          className="w-full p-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-950 font-mono font-bold" 
                        />
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 text-center space-y-1">
                      <span className="text-xs font-bold text-emerald-800 dark:text-emerald-300 uppercase">Cuota Semanal Estimada</span>
                      <h2 className="text-3xl font-extrabold font-mono text-emerald-600 dark:text-emerald-400">$23.50 USD</h2>
                      <span className="text-xs font-mono text-zinc-600 dark:text-zinc-400 block">Bs. {(23.50 * activeRate).toFixed(2)} por semana</span>
                    </div>
                  </div>
                </div>
              )}

              {/* 4. CAJA & BÓVEDA */}
              {currentSection === "treasury" && (
                <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-6 space-y-5">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="font-bold text-base text-zinc-900 dark:text-white">Caja Principal & Arqueo Ciego</h3>
                      <p className="text-xs text-zinc-600 dark:text-zinc-400">Conciliación de turnos y arqueos de gaveta física.</p>
                    </div>
                    <button
                      onClick={() => setIsCashierShiftOpen(true)}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition cursor-pointer shadow-sm"
                    >
                      Ejecutar Arqueo Ciego
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="p-4 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 space-y-1">
                      <span className="text-xs font-bold text-zinc-600 dark:text-zinc-400">Efectivo Físico en Dólares</span>
                      <h4 className="text-xl font-bold font-mono text-zinc-900 dark:text-white">$520.00 USD</h4>
                    </div>
                    <div className="p-4 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 space-y-1">
                      <span className="text-xs font-bold text-zinc-600 dark:text-zinc-400">Efectivo en Bolívares</span>
                      <h4 className="text-xl font-bold font-mono text-zinc-900 dark:text-white">Bs. 24,362.00</h4>
                    </div>
                    <div className="p-4 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 space-y-1">
                      <span className="text-xs font-bold text-zinc-600 dark:text-zinc-400">Billetera Binance USDT</span>
                      <h4 className="text-xl font-bold font-mono text-zinc-900 dark:text-white">150.00 USDT</h4>
                    </div>
                  </div>
                </div>
              )}

              {/* 5. LAS 7 DIMENSIONES */}
              {currentSection === "dimensions" && (
                <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-6 space-y-5">
                  <div>
                    <h3 className="font-bold text-base text-zinc-900 dark:text-white">Las 7 Dimensiones de Configuración de Financiadora</h3>
                    <p className="text-xs text-zinc-600 dark:text-zinc-400">Parámetros clave de crédito, despacho, telemetría y mora.</p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                    <div className="p-4 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 space-y-3">
                      <strong className="font-bold text-zinc-900 dark:text-white block text-sm">1. Condiciones Financieras</strong>
                      <div>
                        <label className="text-zinc-700 dark:text-zinc-300 font-semibold block mb-1">% Inicial por Defecto</label>
                        <input 
                          type="number" 
                          value={dimensions.downPaymentPct} 
                          onChange={e => setDimensions({ ...dimensions, downPaymentPct: Number(e.target.value) })}
                          className="w-full p-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 font-mono font-bold" 
                        />
                      </div>
                      <div>
                        <label className="text-zinc-700 dark:text-zinc-300 font-semibold block mb-1">Mora por Retraso ($ USD / Día)</label>
                        <input 
                          type="number" 
                          step="0.5"
                          value={dimensions.lateFeeValue} 
                          onChange={e => setDimensions({ ...dimensions, lateFeeValue: Number(e.target.value) })}
                          className="w-full p-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 font-mono font-bold" 
                        />
                      </div>
                    </div>

                    <div className="p-4 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 space-y-3">
                      <strong className="font-bold text-zinc-900 dark:text-white block text-sm">2. Telemetría & Despacho</strong>
                      <div>
                        <label className="text-zinc-700 dark:text-zinc-300 font-semibold block mb-1">Días de Gracia antes de Apagar Motor (Kill-Switch)</label>
                        <input 
                          type="number" 
                          value={dimensions.killSwitchGraceDays} 
                          onChange={e => setDimensions({ ...dimensions, killSwitchGraceDays: Number(e.target.value) })}
                          className="w-full p-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 font-mono font-bold" 
                        />
                      </div>
                      <div>
                        <label className="text-zinc-700 dark:text-zinc-300 font-semibold block mb-1">Figura de Contrato Notarial</label>
                        <select 
                          className="w-full p-2 rounded-lg border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 font-bold"
                        >
                          <option>Reserva de Dominio Notariada</option>
                          <option>Crédito Simple con Pagaré OTP</option>
                        </select>
                      </div>
                    </div>
                  </div>
                  
                  <div className="flex justify-end">
                    <button 
                      onClick={() => alert("✅ Parámetros de las 7 dimensiones guardados exitosamente en memoria local.")}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition shadow-sm cursor-pointer"
                    >
                      Guardar Configuración
                    </button>
                  </div>
                </div>
              )}

              {/* 6. MATRIZ RBAC */}
              {currentSection === "rbac" && (
                <div className="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 p-6 space-y-5">
                  <div>
                    <h3 className="font-bold text-base text-zinc-900 dark:text-white">Matriz Dinámica de Permisos RBAC</h3>
                    <p className="text-xs text-zinc-600 dark:text-zinc-400">Haz clic en cualquier casilla para conceder o revocar permisos en tiempo real.</p>
                  </div>

                  <div className="overflow-x-auto rounded-xl border border-zinc-200 dark:border-zinc-800">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="border-b border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-950 text-zinc-600 dark:text-zinc-400 font-bold uppercase text-[10px]">
                          <th className="p-3 pl-4">Permiso</th>
                          {Object.keys(rbacMatrix).map(role => (
                            <th key={role} className="p-3 text-center">{role.replace("_", " ")}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-zinc-200 dark:divide-zinc-800">
                        {["VIEW_DASHBOARD", "MANAGE_USERS", "PROCESS_PAYMENTS", "TREASURY_VAULT", "KILL_SWITCH", "LEGAL_DOCS"].map(perm => (
                          <tr key={perm} className="hover:bg-zinc-50/50 dark:hover:bg-zinc-950/30">
                            <td className="p-3 pl-4 font-semibold text-zinc-900 dark:text-white font-mono">{perm}</td>
                            {Object.keys(rbacMatrix).map(role => {
                              const allowed = (rbacMatrix[role] || []).includes(perm);
                              return (
                                <td key={role} className="p-3 text-center">
                                  <button
                                    onClick={() => togglePermission(role, perm)}
                                    className={"w-7 h-7 rounded-lg transition inline-flex items-center justify-center font-bold " + (
                                      allowed 
                                        ? "bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30"
                                        : "bg-zinc-100 dark:bg-zinc-800 text-zinc-400 border border-zinc-200 dark:border-zinc-700"
                                    )}
                                  >
                                    {allowed ? "✓" : "—"}
                                  </button>
                                </td>
                              );
                            })}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* MODAL DE PAGO */}
          {isPaymentModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs" onClick={() => setIsPaymentModalOpen(false)}>
              <div onClick={e => e.stopPropagation()} className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-zinc-200 dark:border-zinc-800 pb-3">
                  <h3 className="font-bold text-sm text-zinc-900 dark:text-white">Registrar Abono de Cuota</h3>
                  <button onClick={() => setIsPaymentModalOpen(false)} className="text-zinc-400 hover:text-zinc-800 dark:hover:text-white">✕</button>
                </div>

                <form onSubmit={handleProcessPayment} className="space-y-3.5 text-xs">
                  <div>
                    <label className="font-semibold text-zinc-700 dark:text-zinc-300 block mb-1">Cliente Seleccionado</label>
                    <select 
                      value={selectedContract.id} 
                      onChange={e => setSelectedContract(contracts.find(c => c.id === e.target.value))}
                      className="w-full p-2 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-950 font-bold"
                    >
                      {contracts.map(c => (
                        <option key={c.id} value={c.id}>{c.clientName} ({c.clientDocId}) - Saldo: $${c.pendingUSD}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="font-semibold text-zinc-700 dark:text-zinc-300 block mb-1">Monto a Cobrar ($ USD)</label>
                    <input 
                      type="number" 
                      required
                      value={payAmount}
                      onChange={e => setPayAmount(e.target.value)}
                      className="w-full p-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-950 font-mono font-bold text-base text-emerald-600 dark:text-emerald-400"
                    />
                    <span className="text-[11px] text-zinc-600 dark:text-zinc-400 font-mono mt-0.5 block">Equivalente: Bs. {(Number(payAmount) * activeRate).toFixed(2)}</span>
                  </div>

                  <div>
                    <label className="font-semibold text-zinc-700 dark:text-zinc-300 block mb-1">Método de Pago</label>
                    <select 
                      value={payMethod}
                      onChange={e => setPayMethod(e.target.value)}
                      className="w-full p-2 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-950 font-bold"
                    >
                      <option value="PAGO_MOVIL">Pago Móvil (Bs. Tasa Oficial)</option>
                      <option value="CASH_USD">Efectivo Divisas ($ USD)</option>
                      <option value="BINANCE_USDT">Binance USDT (TRC-20)</option>
                    </select>
                  </div>

                  <div>
                    <label className="font-semibold text-zinc-700 dark:text-zinc-300 block mb-1">Número de Referencia</label>
                    <input 
                      type="text" 
                      required
                      value={payRef}
                      onChange={e => setPayRef(e.target.value)}
                      className="w-full p-2 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-950 font-mono"
                    />
                  </div>

                  <button 
                    type="submit"
                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition shadow-md shadow-emerald-950/20 cursor-pointer"
                  >
                    Confirmar Abono & Emitir Recibo
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL DE ARQUEO CIEGO */}
          {isCashierShiftOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs" onClick={() => setIsCashierShiftOpen(false)}>
              <div onClick={e => e.stopPropagation()} className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-zinc-200 dark:border-zinc-800 pb-3">
                  <h3 className="font-bold text-sm text-zinc-900 dark:text-white">Arqueo Ciego & Cierre de Turno</h3>
                  <button onClick={() => setIsCashierShiftOpen(false)} className="text-zinc-400 hover:text-zinc-800 dark:hover:text-white">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-zinc-700 dark:text-zinc-300 block mb-1">Efectivo Físico Contado ($ USD)</label>
                    <input type="number" defaultValue={520} className="w-full p-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-950 font-mono font-bold" />
                  </div>

                  <div>
                    <label className="font-semibold text-zinc-700 dark:text-zinc-300 block mb-1">Efectivo Físico en Bolívares (Bs.)</label>
                    <input type="number" defaultValue={24362} className="w-full p-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-950 font-mono font-bold" />
                  </div>

                  <button
                    onClick={() => { setIsCashierShiftOpen(false); alert("✅ Arqueo Conforme: Los montos físicos declarados coinciden con los registros del turno."); }}
                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition cursor-pointer"
                  >
                    Validar y Cerrar Turno
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
